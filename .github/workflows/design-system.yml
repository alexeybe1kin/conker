name: Design system

on:
  pull_request:
    paths: ["design-system/**", ".github/workflows/design-system.yml"]
  push:
    branches: [main]
    paths: ["design-system/**", ".github/workflows/design-system.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: design-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
      # The initial offline Windows lock lacks other platforms' optional binaries.
      # Regenerate it online before switching this step to npm ci; see the README.
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run test:mutations
